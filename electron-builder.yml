appId: com.duxing.desktop
productName: 笃行
directories:
  output: release
  buildResources: assets
# native 模块（better-sqlite3）由单独的 electron-rebuild -f 重建，跳过 electron-builder 自带 rebuild 以免沙箱内崩溃
npmRebuild: false
# 构建沙箱对 GitHub release-assets 的 TLS 偶发阻断；关闭 electron 校验和下载（zip 已缓存），避免 SHASUMS 请求卡死
electronDownload:
  isVerifyChecksum: false
files:
  - out/**/*
  - package.json
  # 显式带上 better-sqlite3 及其 .node 定位依赖
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  # 运行时窗口与托盘图标
  - assets/icon.png
# 把原生 .node 和图标资源从 asar 中解包，避免运行时读取失败
asarUnpack:
  - '**/*.node'
  - 'assets/icon.*'
win:
  target:
    - nsis
    - portable
  icon: assets/icon.ico
  # 构建沙箱无法拉取 winCodeSign（签名工具），关闭可执行文件签名以彻底跳过下载；产物无 Authenticode 签名
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "duxing-setup-${version}.${ext}"
portable:
  artifactName: "duxing-portable-${version}.${ext}"
